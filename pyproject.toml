[project]
name = "dokidlc-iirc"
version = "0.0.0"
description = "Test harness for the iirc plugin. The plugin itself is bin/iirc and skills/."
requires-python = ">=3.12"

[dependency-groups]
dev = ["numpy>=2", "pytest>=8", "pyyaml>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
