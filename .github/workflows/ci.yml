name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --quiet pytest
      - name: install Claude Code (native installer, stable channel)
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s stable
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: claude --version
      - run: claude plugin validate .
      # the stable channel's test kit cannot stand in for session.append; the latest one can
      - name: claude plugin test (latest channel)
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s latest
          claude --version
          claude plugin test .
